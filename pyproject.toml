[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-monitoring-agent"
version = "2.0.0"
description = "Intelligent Driver Activity Monitoring & Safety Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scikit-learn>=1.4.1.post1",
    "joblib>=1.3.2",
    "loguru>=0.7.2",
    "httpx>=0.27.0"
]

[tool.vercel]
entrypoint = "api/index.py"
